version: '3.8'

services:
  laravel:
    build:
      context: .
    container_name: laravel_api
    restart: unless-stopped
    volumes:
      - .:/var/www
    expose:
      - 9000

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel








