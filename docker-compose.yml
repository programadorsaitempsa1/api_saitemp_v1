version: '3.8'

services:
  laravel:
    build:
      context: .
    container_name: laravel_api
    restart: unless-stopped
    volumes:
      - .:/var/www

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - "80:8082"
    volumes:
      - .:/var/www
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel







