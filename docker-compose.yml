version: '3.8'

services:
  app:
    build:
      context: .
    container_name: laravel_api
    restart: unless-stopped
    volumes:
      - .:/var/www

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

